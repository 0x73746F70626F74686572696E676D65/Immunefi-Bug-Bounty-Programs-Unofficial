name: Fetch sources for metadata-active programs
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/source-archive.yml
permissions:
  contents: write
concurrency:
  group: active-program-source-archive
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure source archive commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.compression 1
          git config core.bigFileThreshold 5m
          git config pack.window 0
      - name: Fetch and push source batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_sources.py --workers 24 --retry --push
      - name: Retry unavailable source URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_sources.py --workers 16 --retry --push
      - name: Fetch and push pinned submodule sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_submodules.py
      - name: Fetch and push proxy implementation sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_proxy_sources.py
      - name: Verify source archives and publish coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_sources.py
